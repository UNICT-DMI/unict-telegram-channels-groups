name: Build & Deploy

on:
  push:
    branches: [msin]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          check-latest: true

      - name: Install dependencies
        run: npm install

      - name: Deploy
        run: |
          git config --global user.name $name
          git config --global user.email $email
          git remote set-url origin https://${token}@github.com/${repository}
          npm run deploy
        env:
          name: 'github-actions[bot]'
          email: 'github-actions[bot]@users.noreply.github.com'
          token: ${{ secrets.GHPAGES_TOKEN }}
          repository: ${{ github.repository }}
          # react-scripts 4 on Node 18+: webpack 4 needs the legacy OpenSSL
          # provider, and source map generation breaks on the global fetch
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: false
